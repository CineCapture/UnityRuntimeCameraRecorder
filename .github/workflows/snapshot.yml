name: Snapshot build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET Standard 2.1 / AnyCPU
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      UNITY_VERSION: 6000.0.61f1
      MEDIA_WRITER_REVISION: f9b92f201b4d6df7720c041ec04bd67a20944620
      VIDEO_ENCODER_REVISION: c85b9c8ed9d50b4f18f7cfaa64638a51990d7a44
    defaults:
      run:
        shell: pwsh
        working-directory: UnityRuntimeCameraRecorder

    steps:
      - name: Check out recorder source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: UnityRuntimeCameraRecorder
          persist-credentials: false

      - name: Check out media writer dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: end3rbyte/FFmpegMediaWriter
          ref: ${{ env.MEDIA_WRITER_REVISION }}
          path: FFmpegMediaWriter
          persist-credentials: false

      - name: Check out video encoder dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: UnityRuntimeCameraRecorder/Direct3DVideoEncoder
          ref: ${{ env.VIDEO_ENCODER_REVISION }}
          path: Direct3DVideoEncoder
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # Install the editor only to reference its managed assemblies; do not launch it.
      - name: Set up Unity compilation references
        id: unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2
        with:
          version-file: None
          unity-version: ${{ env.UNITY_VERSION }}
          cache-installation: true

      - name: Build native video encoder
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe'
          if ($LASTEXITCODE -ne 0 -or -not $msbuild) {
            throw 'Visual Studio C++ build tools were not found.'
          }
          & ($msbuild | Select-Object -First 1) ../Direct3DVideoEncoder/Direct3DVideoEncoder.vcxproj /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Native build failed with exit code $LASTEXITCODE."
          }

      - name: Build managed DLLs
        env:
          UNITY_EXECUTABLE: ${{ steps.unity.outputs.unity-editor-path }}
        run: |
          $editorDirectory = Split-Path -Parent $env:UNITY_EXECUTABLE
          $managed = Join-Path $editorDirectory 'Data/Managed/UnityEngine'
          if (-not (Test-Path -LiteralPath (Join-Path $managed 'UnityEngine.CoreModule.dll'))) {
            throw "Unity compilation references were not found in $managed."
          }
          New-Item -ItemType Directory -Path obj -Force | Out-Null
          dotnet build UnityRuntimeCameraRecorder.csproj -c Release "-p:UnityManagedPath=$managed" -v minimal /fl '/flp:logfile=obj/snapshot-build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Package snapshot
        run: |
          $snapshot = 'bin/snapshot'
          Remove-Item -LiteralPath $snapshot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $snapshot -Force | Out-Null
          Copy-Item -LiteralPath 'bin/Release/netstandard2.1/UnityRuntimeCameraRecorder.dll', 'bin/Release/netstandard2.1/FFmpegMediaWriter.dll', '../Direct3DVideoEncoder/build/x64/Release/Direct3DVideoEncoder.dll', 'LICENSE', 'README.md' -Destination $snapshot
          $hashes = [ordered]@{}
          foreach ($name in 'UnityRuntimeCameraRecorder.dll', 'FFmpegMediaWriter.dll', 'Direct3DVideoEncoder.dll') {
            $dll = Get-Item -LiteralPath "$snapshot/$name"
            if ($dll.Length -eq 0) {
              throw "The compiled $name is empty."
            }
            $hashes[$name] = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash
          }
          [ordered]@{
            kind = 'snapshot'
            commit = (git rev-parse HEAD)
            mediaWriterCommit = (git -C ../FFmpegMediaWriter rev-parse HEAD)
            videoEncoderCommit = (git -C ../Direct3DVideoEncoder rev-parse HEAD)
            unityVersion = $env:UNITY_VERSION
            run = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            builtUtc = [DateTime]::UtcNow.ToString('O')
            framework = '.NET Standard 2.1'
            platform = 'AnyCPU'
            configuration = 'Release'
            dllSha256 = $hashes
          } | ConvertTo-Json | Set-Content -LiteralPath "$snapshot/build-info.json" -Encoding utf8
          Compress-Archive -Path "$snapshot/*" -DestinationPath 'bin/UnityRuntimeCameraRecorder-1.0.0-snapshot-windows-x64.zip' -Force

      - name: Upload snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UnityRuntimeCameraRecorder-snapshot-netstandard2.1-anycpu-${{ github.sha }}-${{ github.run_attempt }}
          path: UnityRuntimeCameraRecorder/bin/snapshot/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: UnityRuntimeCameraRecorder-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: UnityRuntimeCameraRecorder/obj/snapshot-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish snapshot prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: 1.0.0-snapshot
        run: |
          $tagReference = "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:SNAPSHOT_TAG"
          gh api --method PATCH $tagReference -f sha="$env:GITHUB_SHA" -F force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:SNAPSHOT_TAG" -f sha="$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to update the snapshot tag.'
          }
          gh release view $env:SNAPSHOT_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:SNAPSHOT_TAG --title $env:SNAPSHOT_TAG --prerelease --notes 'Latest automatic snapshot from the main branch.'
          } else {
            gh release create $env:SNAPSHOT_TAG --title $env:SNAPSHOT_TAG --prerelease --notes 'Latest automatic snapshot from the main branch.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to create or update the snapshot prerelease.'
          }
          foreach ($asset in (gh release view $env:SNAPSHOT_TAG --json assets --jq '.assets[].name')) {
            gh release delete-asset $env:SNAPSHOT_TAG $asset --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to delete previous snapshot asset: $asset"
            }
          }
          gh release upload $env:SNAPSHOT_TAG 'bin/UnityRuntimeCameraRecorder-1.0.0-snapshot-windows-x64.zip' --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to upload the snapshot archive.'
          }
